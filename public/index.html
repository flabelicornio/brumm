<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brumm Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/png" href="https://industriasplaneta.wordpress.com/wp-content/uploads/2026/09/brumm-i.png">
    
    <!-- Meta tags para compatibilidad iOS / Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brumm">
    <link rel="apple-touch-icon" href="https://industriasplaneta.wordpress.com/wp-content/uploads/2026/09/brumm-i.png">

    <!-- CDNs de Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --panel-bg: rgba(18, 18, 26, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.4);
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --sidebar-w: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #visualizer-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .app-container { position: relative; z-index: 2; display: flex; flex: 1; height: calc(100vh - 90px); backdrop-filter: blur(20px); }
        
        /* Sidebar */
        .sidebar { width: var(--sidebar-w); background: var(--panel-bg); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; padding: 20px; transition: transform 0.3s ease; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 30px; }
        .brand img { width: 32px; height: 32px; border-radius: 8px; }
        
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .nav-item.active { background: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
        
        /* Main Area */
        .main-content { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        
        .search-box { position: relative; flex: 1; max-width: 400px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { width: 100%; padding: 12px 12px 12px 42px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border); border-radius: 20px; color: #fff; outline: none; }
        
        .btn-action { background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); color: #fff; padding: 10px 18px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; transition: 0.2s; }
        .btn-action:hover { background: rgba(255,255,255,0.1); }
        .btn-action.primary { background: var(--accent); border: none; box-shadow: 0 4px 12px var(--accent-glow); }

        /* Video Display Area */
        #video-container { width: 100%; max-height: 400px; background: #000; border-radius: 16px; overflow: hidden; display: none; position: relative; }
        #videoEl { width: 100%; height: 100%; max-height: 400px; object-fit: contain; }

        /* List Views */
        .track-list { display: flex; flex-direction: column; gap: 6px; }
        .track-card { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: rgba(255, 255, 255, 0.02); border: 1px solid transparent; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .track-card:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--panel-border); }
        .track-card.active { background: rgba(255, 42, 95, 0.1); border-color: var(--accent); }
        
        .track-info-group { display: flex; align-items: center; gap: 15px; }
        .track-thumb { width: 42px; height: 42px; border-radius: 8px; background: #222; object-fit: cover; display: flex; align-items: center; justify-content: center; }
        .track-titles h4 { font-size: 0.95rem; font-weight: 500; }
        .track-titles p { font-size: 0.8rem; color: var(--text-muted); }

        /* Bottom Player Bar */
        .player-bar { height: 90px; background: var(--panel-bg); border-top: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; position: relative; z-index: 10; }
        .now-playing { display: flex; align-items: center; gap: 15px; width: 25%; }
        .now-playing img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; }
        
        .controls-center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 45%; }
        .btn-controls { display: flex; align-items: center; gap: 20px; }
        .btn-cmd { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .btn-cmd:hover, .btn-cmd.active { color: #fff; }
        .btn-cmd.play { width: 42px; height: 42px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .btn-cmd.play:hover { transform: scale(1.05); }

        .progress-group { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: var(--text-muted); }
        .progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 2px; }

        .extra-controls { display: flex; align-items: center; justify-content: flex-end; gap: 15px; width: 25%; }

        /* Vis Visualizer Modes Selector */
        .vis-selector { position: absolute; top: 15px; right: 25px; display: flex; gap: 8px; z-index: 5; }
        .vis-btn { background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); color: var(--text-muted); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; cursor: pointer; }
        .vis-btn.active { color: #fff; border-color: var(--accent); }

        @media (max-width: 768px) {
            .sidebar { position: absolute; left: -100%; height: 100%; z-index: 20; background: #0a0a0f; }
            .sidebar.open { transform: translateX(100%); }
            .now-playing { width: 40%; }
            .controls-center { width: 50%; }
            .extra-controls { display: none; }
        }
    </style>
</head>
<body>

    <div id="visualizer-container"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img src="https://industriasplaneta.wordpress.com/wp-content/uploads/2026/09/brumm-i.png" alt="Brumm">
                <span>Brumm Player</span>
            </div>
            <ul class="nav-list">
                <li class="nav-item active" onclick="switchTab('local')"><i class="fa-solid fa-folder-open"></i> Local & Disco</li>
                <li class="nav-item" onclick="switchTab('jamendo')"><i class="fa-solid fa-globe"></i> Jamendo Music</li>
                <li class="nav-item" onclick="switchTab('archive')"><i class="fa-solid fa-box-archive"></i> Internet Archive</li>
                <li class="nav-item" onclick="switchTab('playlists')"><i class="fa-solid fa-list-ul"></i> Playlists</li>
            </ul>
        </aside>

        <!-- Main Content View -->
        <main class="main-content">
            <div class="header-bar">
                <button class="btn-action" id="menuToggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Buscar música o video..." onkeyup="handleSearch(event)">
                </div>
                <label class="btn-action primary">
                    <i class="fa-solid fa-plus"></i> Abrir Archivos
                    <input type="file" id="fileInput" multiple accept="audio/*,video/*" style="display:none" onchange="handleFileSelect(event)">
                </label>
            </div>

            <!-- Visualizer Preset Selector -->
            <div class="vis-selector">
                <button class="vis-btn active" onclick="setVisMode(0)">3D Bars</button>
                <button class="vis-btn" onclick="setVisMode(1)">Waveform</button>
                <button class="vis-btn" onclick="setVisMode(2)">Particles</button>
            </div>

            <!-- Container para Reproducción de Vídeo -->
            <div id="video-container">
                <video id="videoEl" crossorigin="anonymous" playsinline></video>
            </div>

            <!-- Lista de Archivos -->
            <div class="track-list" id="trackList">
                <!-- Se poblará mediante JS -->
            </div>
        </main>
    </div>

    <!-- Barra Inferior Reproductor -->
    <footer class="player-bar">
        <div class="now-playing">
            <img src="https://industriasplaneta.wordpress.com/wp-content/uploads/2026/09/brumm-i.png" id="albumArt" alt="Cover">
            <div class="track-titles">
                <h4 id="trackTitle">Selecciona una pista</h4>
                <p id="trackArtist">Brumm Player</p>
            </div>
        </div>

        <div class="controls-center">
            <div class="btn-controls">
                <button class="btn-cmd" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle" id="shuffleIcon"></i></button>
                <button class="btn-cmd" onclick="playPrev()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="btn-cmd play" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button class="btn-cmd" onclick="playNext()"><i class="fa-solid fa-forward-step"></i></button>
                <button class="btn-cmd" onclick="toggleRepeat()"><i class="fa-solid fa-repeat" id="repeatIcon"></i></button>
            </div>
            <div class="progress-group">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" onclick="seek(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <i class="fa-solid fa-volume-high" style="color:var(--text-muted)"></i>
            <input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" style="width:80px">
        </div>
    </footer>

    <!-- Elemento Audio Nativo Oculto -->
    <audio id="audioEl" crossorigin="anonymous"></audio>

    <script>
        /* CONFIGURACIÓN Y CONSTANTES */
        const JAMENDO_CLIENT_ID = 'b6747d04'; // Clave de API Jamendo integrada de cortesía
        
        let playlist = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let currentTab = 'local';
        let visMode = 0; // 0: Bars 3D, 1: Wave, 2: Particles

        /* AUDIO CONTEXT & THREE.JS VISUALIZER */
        let AC, analyser, dataArray;
        let scene, camera, renderer, barsGroup, particles;
        
        function initAudioContext() {
            if (!AC) {
                AC = new (window.AudioContext || window.webkitAudioContext)();
                analyser = AC.createAnalyser();
                analyser.fftSize = 128;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                const audioEl = document.getElementById('audioEl');
                const videoEl = document.getElementById('videoEl');
                
                const sourceAudio = AC.createMediaElementSource(audioEl);
                const sourceVideo = AC.createMediaElementSource(videoEl);
                
                sourceAudio.connect(analyser);
                sourceVideo.connect(analyser);
                analyser.connect(AC.destination);
            }
            if (AC.state === 'suspended') {
                AC.resume();
            }
        }

        function init3D() {
            const container = document.getElementById('visualizer-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 25);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Crear Barras
            barsGroup = new THREE.Group();
            const numBars = 32;
            const geometry = new THREE.BoxGeometry(0.5, 1, 0.5);
            
            for (let i = 0; i < numBars; i++) {
                const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(`hsl(${i * 10}, 80%, 50%)`) });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.x = (i - numBars / 2) * 0.8;
                barsGroup.add(mesh);
            }
            scene.add(barsGroup);

            // Partículas para Modo 2
            const pGeometry = new THREE.BufferGeometry();
            const pCount = 500;
            const pPos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i++) pPos[i] = (Math.random() - 0.5) * 40;
            pGeometry.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMaterial = new THREE.PointsMaterial({ size: 0.2, color: 0xff2a5f });
            particles = new THREE.Points(pGeometry, pMaterial);
            scene.add(particles);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                if (visMode === 0) {
                    barsGroup.visible = true;
                    particles.visible = false;
                    for (let i = 0; i < barsGroup.children.length; i++) {
                        const val = dataArray[i] || 0;
                        barsGroup.children[i].scale.y = Math.max(0.1, val / 10);
                    }
                } else if (visMode === 2) {
                    barsGroup.visible = false;
                    particles.visible = true;
                    particles.rotation.y += 0.002;
                    particles.rotation.x += 0.001;
                } else {
                    barsGroup.visible = false;
                    particles.visible = false;
                }
            }
            renderer.render(scene, camera);
        }

        function setVisMode(mode) {
            visMode = mode;
            document.querySelectorAll('.vis-btn').forEach((b, i) => b.classList.toggle('active', i === mode));
        }

        /* GESTIÓN DE PISTAS Y ARCHIVOS */
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const isVid = file.type.startsWith('video/');
                const track = {
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: 'Archivo Local',
                    url: URL.createObjectURL(file),
                    cover: 'https://industriasplaneta.wordpress.com/wp-content/uploads/2026/09/brumm-i.png',
                    isVideo: isVid
                };
                playlist.push(track);
            });
            renderPlaylist();
            if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
        }

        function renderPlaylist() {
            const container = document.getElementById('trackList');
            container.innerHTML = '';
            playlist.forEach((track, idx) => {
                const card = document.createElement('div');
                card.className = `track-card ${idx === currentIndex ? 'active' : ''}`;
                card.onclick = () => loadTrack(idx);
                card.innerHTML = `
                    <div class="track-info-group">
                        <img class="track-thumb" src="${track.cover}">
                        <div class="track-titles">
                            <h4>${track.title}</h4>
                            <p>${track.artist} ${track.isVideo ? '<i class="fa-solid fa-video" style="margin-left:5px"></i>' : ''}</p>
                        </div>
                    </div>
                    <span style="font-size:0.8rem; color:var(--text-muted)"><i class="fa-solid fa-play"></i></span>
                `;
                container.appendChild(card);
            });
        }

        function loadTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            initAudioContext();
            currentIndex = index;
            const track = playlist[currentIndex];

            const audioEl = document.getElementById('audioEl');
            const videoEl = document.getElementById('videoEl');
            const videoContainer = document.getElementById('video-container');

            // Detener ambos elementos antes de cargar
            audioEl.pause();
            videoEl.pause();

            if (track.isVideo) {
                videoContainer.style.display = 'block';
                videoEl.src = track.url;
                videoEl.load();
                videoEl.play();
            } else {
                videoContainer.style.display = 'none';
                videoEl.pause();
                videoEl.removeAttribute('src'); // Limpieza de vídeo
                videoEl.load();
                
                audioEl.src = track.url;
                audioEl.load();
                audioEl.play();
            }

            isPlaying = true;
            updateUI();
            renderPlaylist();
        }

        function togglePlay() {
            if (currentIndex === -1 && playlist.length > 0) {
                loadTrack(0);
                return;
            }
            const track = playlist[currentIndex];
            const mediaEl = track?.isVideo ? document.getElementById('videoEl') : document.getElementById('audioEl');

            if (isPlaying) {
                mediaEl.pause();
            } else {
                initAudioContext();
                mediaEl.play();
            }
            isPlaying = !isPlaying;
            updateUI();
        }

        function playNext() {
            if (playlist.length === 0) return;
            let nextIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : currentIndex + 1;
            if (nextIndex >= playlist.length) nextIndex = 0;
            loadTrack(nextIndex);
        }

        function playPrev() {
            if (playlist.length === 0) return;
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) prevIndex = playlist.length - 1;
            loadTrack(prevIndex);
        }

        function updateUI() {
            const track = playlist[currentIndex];
            if (!track) return;

            document.getElementById('trackTitle').innerText = track.title;
            document.getElementById('trackArtist').innerText = track.artist;
            document.getElementById('albumArt').src = track.cover;

            const playIcon = document.getElementById('playIcon');
            playIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        function seek(e) {
            const track = playlist[currentIndex];
            if (!track) return;
            const mediaEl = track.isVideo ? document.getElementById('videoEl') : document.getElementById('audioEl');
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            mediaEl.currentTime = pos * mediaEl.duration;
        }

        function setVolume(v) {
            document.getElementById('audioEl').volume = v;
            document.getElementById('videoEl').volume = v;
        }

        /* INTEGRACIÓN CON JAMENDO & SEARCH */
        async function fetchJamendoTracks(query = 'pop') {
            try {
                const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=15&search=${encodeURIComponent(query)}`);
                const data = await res.json();
                playlist = data.results.map(t => ({
                    title: t.name,
                    artist: t.artist_name,
                    url: t.audio,
                    cover: t.album_image || t.image,
                    isVideo: false
                }));
                renderPlaylist();
            } catch (err) {
                console.error("Error cargando de Jamendo:", err);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (tab === 'jamendo') fetchJamendoTracks('top');
            if (tab === 'local') renderPlaylist();
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const q = e.target.value.trim();
                if (q && currentTab === 'jamendo') fetchJamendoTracks(q);
            }
        }

        /* CONFIGURACIÓN Y SINCRONIZACIÓN DE EVENTOS */
        window.addEventListener('DOMContentLoaded', () => {
            init3D();

            const audioEl = document.getElementById('audioEl');
            const videoEl = document.getElementById('videoEl');

            [audioEl, videoEl].forEach(media => {
                media.addEventListener('timeupdate', () => {
                    if (media.duration) {
                        const progress = (media.currentTime / media.duration) * 100;
                        document.getElementById('progressFill').style.width = `${progress}%`;
                        document.getElementById('currentTime').innerText = formatTime(media.currentTime);
                        document.getElementById('totalTime').innerText = formatTime(media.duration);
                    }
                });

                media.addEventListener('ended', () => {
                    if (isRepeat) loadTrack(currentIndex);
                    else playNext();
                });
            });

            // Registro del Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
            }
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
