<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brumm Media Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --panel-bg: #13131c;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container Principal */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 900px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    @media (min-width: 768px) {
      .app-container {
        height: 92vh;
        border-radius: 24px;
        border: 1px solid var(--border-color);
      }
    }

    /* Header */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
    }

    /* Visualizador Spectrum */
    .visualizer-container {
      width: 100%;
      height: 180px;
      position: relative;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Player Info */
    .track-info {
      padding: 20px;
      text-align: center;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .track-artist {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Controles */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 10px 20px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-play {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Progress Bar */
    .progress-container {
      padding: 0 20px;
      margin-top: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Import Button Area */
    .actions {
      padding: 20px;
      display: flex;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>BRUMM</h1>
      <span id="sw-status" style="font-size: 0.7rem; color: #00ff88;">● Online</span>
    </header>

    <div class="visualizer-container">
      <canvas id="visualizer"></canvas>
    </div>

    <div class="track-info">
      <div class="track-title" id="track-title">Sin reproducción</div>
      <div class="track-artist" id="track-artist">Selecciona un archivo local</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-stamps">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-prev">⏮</button>
      <button class="btn btn-play" id="btn-play">▶</button>
      <button class="btn" id="btn-next">⏭</button>
    </div>

    <div class="actions">
      <button class="btn-action" onclick="document.getElementById('file-input').click()">📁 Cargar Música</button>
      <input type="file" id="file-input" accept="audio/*,video/*" multiple>
    </div>
  </div>

  <!-- Reproductor HTML5 oculto para Streaming progresivo sin saturación de RAM -->
  <audio id="audio-element" crossorigin="anonymous"></audio>

  <script>
    // --- 1. Registro del Service Worker ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registrado:', reg.scope))
          .catch(err => console.error('Error al registrar SW:', err));
      });
    }

    // --- 2. Elementos DOM ---
    const audioElement = document.getElementById('audio-element');
    const playBtn = document.getElementById('btn-play');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const totalTimeEl = document.getElementById('total-time');
    const fileInput = document.getElementById('file-input');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    let playlist = [];
    let currentIndex = 0;
    let audioCtx, analyser, sourceNode;
    let isAudioCtxSetup = false;

    // Ajustar resolución del Canvas
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 3. Web Audio API Setup ---
    function setupWebAudio() {
      if (isAudioCtxSetup) return;
      
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;

      sourceNode = audioCtx.createMediaElementSource(audioElement);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      isAudioCtxSetup = true;
      drawVisualizer();
    }

    // --- 4. Visualizador Canvas ---
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 1.5;
      let barHeight;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * canvas.height;

        canvasCtx.fillStyle = `rgb(255, 0, ${Math.min(255, barHeight + 100)})`;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

        x += barWidth + 1;
      }
    }

    // --- 5. Lógica de Reproducción ---
    function loadTrack(index) {
      if (playlist.length === 0) return;
      
      const item = playlist[index];
      const objectUrl = URL.createObjectURL(item.file);
      audioElement.src = objectUrl;

      trackTitle.textContent = item.name;
      trackArtist.textContent = "Archivo Local";

      // Configurar MediaSession para notificaciones en Android/Windows
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: item.name,
          artist: 'Brumm Player',
          album: 'Biblioteca Local'
        });
      }

      playTrack();
    }

    function playTrack() {
      setupWebAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioElement.play();
      playBtn.textContent = '⏸';
    }

    function pauseTrack() {
      audioElement.pause();
      playBtn.textContent = '▶';
    }

    // Controls Event Listeners
    playBtn.addEventListener('click', () => {
      if (audioElement.paused) {
        if (playlist.length > 0) playTrack();
      } else {
        pauseTrack();
      }
    });

    // Carga de Archivos
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      playlist = files.map(file => ({
        name: file.name.replace(/\.[^/.]+$/, ""),
        file: file
      }));

      currentIndex = 0;
      loadTrack(currentIndex);
    });

    // Barra de Progreso y Tiempo
    audioElement.addEventListener('timeupdate', () => {
      if (!audioElement.duration) return;
      const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
      progressFill.style.width = `${progressPercent}%`;

      currentTimeEl.textContent = formatTime(audioElement.currentTime);
      totalTimeEl.textContent = formatTime(audioElement.duration);
    });

    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      const duration = audioElement.duration;
      audioElement.currentTime = (clickX / width) * duration;
    });

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
  </script>
</body>
</html>
